version: '3.8'

services:
  # ============================================
  # Base de datos PostgreSQL (América)
  # ============================================
  postgres-america:
    image: postgres:15
    container_name: postgres-america
    environment:
      POSTGRES_DB: globalshop
      POSTGRES_USER: symmetricds
      POSTGRES_PASSWORD: symmetricds
    ports:
      - "5432:5432"
    volumes:
      - ./init-db/postgres:/docker-entrypoint-initdb.d
      - postgres-data:/var/lib/postgresql/data
    networks:
      - globalshop-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U symmetricds -d globalshop"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # Base de datos MySQL (Europa)
  # ============================================
  mysql-europe:
    image: mysql:8.0
    container_name: mysql-europe
    command: --log-bin-trust-function-creators=1
    environment:
      MYSQL_DATABASE: globalshop
      MYSQL_USER: symmetricds
      MYSQL_PASSWORD: symmetricds
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    volumes:
      - ./init-db/mysql:/docker-entrypoint-initdb.d
      - mysql-data:/var/lib/mysql
    networks:
      - globalshop-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "symmetricds", "-psymmetricds"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # SymmetricDS Nodo América (PostgreSQL)
  # ============================================
  symmetricds-america:
    image: jumpmind/symmetricds:3.16
    container_name: symmetricds-america
    environment:
      - SYMMETRIC_HOME=/opt/symmetric-ds
    ports:
      - "31415:31415"
    volumes:
      - ./symmetricds/america/america.properties:/opt/symmetric-ds/engines/america.properties
    depends_on:
      postgres-america:
        condition: service_healthy
    networks:
      - globalshop-network
    restart: unless-stopped

  # ============================================
  # SymmetricDS Nodo Europa (MySQL)
  # ============================================
  symmetricds-europe:
    image: jumpmind/symmetricds:3.16
    container_name: symmetricds-europe
    environment:
      - SYMMETRIC_HOME=/opt/symmetric-ds
    ports:
      - "31416:31416"
    volumes:
      - ./symmetricds/europe/europe.properties:/opt/symmetric-ds/engines/europe.properties
    depends_on:
      mysql-europe:
        condition: service_healthy
      symmetricds-america:
        condition: service_started
    networks:
      - globalshop-network
    restart: unless-stopped

# ============================================
# Redes
# ============================================
networks:
  globalshop-network:
    driver: bridge
    name: globalshop-network

# ============================================
# Volúmenes para persistencia
# ============================================
volumes:
  postgres-data:
    name: globalshop-postgres-data
  mysql-data:
    name: globalshop-mysql-data
