# ==============================================
# DOCKER COMPOSE - GlobalShop Replicación Bidireccional
# Estudiante: Elkin Delgado
# ==============================================
services:
  # ============================================
  # Base de Datos PostgreSQL (América)
  # ============================================
  postgres-america:
    image: postgres:15
    container_name: postgres-america
    hostname: postgres-america
    environment:
      POSTGRES_DB: globalshop
      POSTGRES_USER: symmetricds
      POSTGRES_PASSWORD: symmetricds
    ports:
      - "5432:5432"
    volumes:
      - ./init-db/postgres:/docker-entrypoint-initdb.d
      - postgres-data:/var/lib/postgresql/data
    networks:
      - globalshop-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U symmetricds -d globalshop"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # Base de Datos MySQL (Europa)
  # ============================================
  mysql-europe:
    image: mysql:8.0
    container_name: mysql-europe
    hostname: mysql-europe
    environment:
      MYSQL_DATABASE: globalshop
      MYSQL_USER: symmetricds
      MYSQL_PASSWORD: symmetricds
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    volumes:
      - ./init-db/mysql:/docker-entrypoint-initdb.d
      - mysql-data:/var/lib/mysql
    networks:
      - globalshop-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "symmetricds", "-psymmetricds"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: --default-authentication-plugin=mysql_native_password --log-bin-trust-function-creators=1

  # ============================================
  # SymmetricDS Nodo América (PostgreSQL) - ROOT
  # ============================================
  symmetricds-america:
    image: jumpmind/symmetricds:3.16
    container_name: symmetricds-america
    hostname: symmetricds-america
    environment:
      - SYMMETRIC_HOME=/opt/symmetric-ds
    ports:
      - "31415:31415"
    volumes:
      - ./symmetricds/america/america.properties:/opt/symmetric-ds/engines/america.properties:ro
      - ./symmetricds/america/engines/america-setup.sql:/opt/symmetric-ds/setup/america-setup.sql:ro
    depends_on:
      postgres-america:
        condition: service_healthy
    networks:
      - globalshop-network
    entrypoint:
      - /bin/sh
      - -c
      - |
        /opt/symmetric-ds/bin/sym &
        SYM_PID=$$!
        echo "Esperando que SymmetricDS inicie..."
        sleep 60
        echo "Ejecutando configuración SQL..."
        /opt/symmetric-ds/bin/dbsql --engine america < /opt/symmetric-ds/setup/america-setup.sql || true
        echo "Configuración SQL completada."
        wait $$SYM_PID

  # ============================================
  # SymmetricDS Nodo Europa (MySQL) - CLIENT
  # ============================================
  symmetricds-europe:
    image: jumpmind/symmetricds:3.16
    container_name: symmetricds-europe
    hostname: symmetricds-europe
    environment:
      - SYMMETRIC_HOME=/opt/symmetric-ds
    ports:
      - "31416:31416"
    volumes:
      - ./symmetricds/europe/europe.properties:/opt/symmetric-ds/engines/europe.properties:ro
    depends_on:
      mysql-europe:
        condition: service_healthy
      symmetricds-america:
        condition: service_started
    networks:
      - globalshop-network

# ============================================
# Redes
# ============================================
networks:
  globalshop-network:
    driver: bridge
    name: globalshop-network

# ============================================
# Volúmenes
# ============================================
volumes:
  postgres-data:
  mysql-data:
