# -----------------------------------------------
# Archivo de propiedades del nodo AMERICA
# -----------------------------------------------
# 
# Este archivo configura el nodo maestro que se conecta
# a PostgreSQL y gestiona la replicacion con Europa.
#
# -----------------------------------------------

# -----------------------------------------------
# Datos de identificacion del nodo
# -----------------------------------------------
# Grupo y ID externo para el nodo America
engine.name=america
group.id=america-store
external.id=america-001

# -----------------------------------------------
# Parametros de conexion a PostgreSQL
# -----------------------------------------------

db.driver=org.postgresql.Driver
db.url=jdbc:postgresql://postgres-america:5432/globalshop
db.user=symmetricds
db.password=symmetricds

# -----------------------------------------------
# Configuracion de registro
# -----------------------------------------------
# Nodo raiz - no requiere URL de registro

registration.url=

# --------------------------------------------
# Configuración de Sincronización
# --------------------------------------------
# URL de sincronización de este nodo
sync.url=http://symmetricds-america:31415/sync/america

# Intervalo de push/pull (en milisegundos)
# Controla con qué frecuencia se envían/reciben cambios
job.push.period.time.ms=5000
job.pull.period.time.ms=5000
job.routing.period.time.ms=5000

# --------------------------------------------
# Servicios y Características
# --------------------------------------------
# Habilitar servicios de sincronización
start.push.job=true
start.pull.job=true
start.route.job=true
start.heartbeat.job=true

# Auto registro y creación de triggers
auto.register=true
auto.reload=true
auto.upgrade=true
auto.sync.configuration=true

# *** IMPORTANTE: Permitir registro automático de nuevos nodos ***
# Habilita que nuevos nodos se auto-registren
registration.auto=true

# Crear registro automáticamente cuando un nodo desconocido intenta registrarse
auto.registration=true

# Carga inicial - Importante para nuevos nodos
initial.load.create.first=true
initial.load.use.extract.job=false

# --------------------------------------------
# Configuración HTTP/REST API
# --------------------------------------------
# Puerto para el servicio HTTP de SymmetricDS
# COMPLETAR: Puerto (ej: 31415)
http.enable=true
http.port=31415

# Tiempo de espera
http.timeout.ms=90000

# --------------------------------------------
# Logging y Debugging
# --------------------------------------------
# Nivel de log (ERROR, WARN, INFO, DEBUG)
console.log.level=INFO

# Log de datos sincronizados (útil para debugging)
log.conflict.resolution=true

# --------------------------------------------
# Configuración de Transformación de Datos
# --------------------------------------------
# SymmetricDS manejará diferencias entre PostgreSQL y MySQL
# automáticamente, pero podemos especificar comportamientos

# Manejo de conflictos (last_write_wins, manual, ignore)
conflict.resolver=last_write_wins

# --------------------------------------------
# Parámetros de Red
# --------------------------------------------
# Tamaño de lote para sincronización
transport.max.bytes.to.sync=1048576

# Timeout de conexión
transport.timeout.ms=300000

# -----------------------------------------------
# Recordatorios:
# - Este nodo inicia primero
# - Europa se conecta a este nodo
# - Verificar que los puertos coincidan con docker-compose
# -----------------------------------------------
