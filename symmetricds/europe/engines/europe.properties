#
# Sin embargo, si deseas configurar algo específico para Europa,
# puedes hacerlo aquí.
#
# ============================================

# ============================================
# CONFIGURACIÓN PARA ESTE EXAMEN
# ============================================
# 
# Este archivo se deja VACÍO intencionalmente porque:
# 
# 1. El nodo Europa se registrará automáticamente contra el nodo América
# 2. Toda la configuración de tablas, triggers, routers y canales
#    se definió en america.properties y se propagará automáticamente
# 3. SymmetricDS sincronizará la configuración desde el nodo raíz (América)
#    a este nodo secundario (Europa) durante el proceso de registro
# 4. Esto simplifica la administración y evita inconsistencias
#
# La replicación bidireccional funcionará correctamente con esta
# configuración porque:
# - Los triggers se crearán automáticamente en ambas bases de datos
# - Los routers bidireccionales (america_to_europe y europe_to_america)
#   están configurados en el nodo raíz
# - Ambos nodos tienen habilitados push.job y pull.job
#
# ============================================

-- Este archivo puede estar vacío para configuración estándar
-- La configuración se propagará desde el nodo América

